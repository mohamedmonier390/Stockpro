name: Flutter Android build
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/edit-existing-records]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: if [ -d test ]; then flutter test; else echo 'No test directory; skipping Flutter tests.'; fi
      - name: Generate Android platform files if missing
        run: if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then flutter create --platforms=android --project-name stockpro --org com.stockpro.app .; fi
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: stockpro-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
