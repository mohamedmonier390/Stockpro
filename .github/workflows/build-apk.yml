name: Build StockPro Release Candidate
on:
  workflow_dispatch:
  push:
    branches: [ main, 'commercial/**', 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
      - name: Validate permanent signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then echo "Missing secret: $secret"; exit 1; fi
          done
      - name: Generate Android project files
        run: flutter create --platforms=android --org com.stockpro --project-name stockpro .
      - name: Configure label and release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/stockpro-release-key.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=app/stockpro-release-key.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()
          s, n = re.subn(r'android:label="[^"]+"', 'android:label="StockPro Business"', s, count=1)
          if n != 1: raise SystemExit("Could not set app label")
          manifest.write_text(s)
          gradle_groovy = Path("android/app/build.gradle")
          gradle_kotlin = Path("android/app/build.gradle.kts")
          if gradle_groovy.exists():
              gradle = gradle_groovy
              s = gradle.read_text()
              if "stockproReleaseSigning" not in s:
                  props = """
          def stockproSigningProperties = new Properties()
          def stockproSigningFile = rootProject.file('key.properties')
          stockproSigningProperties.load(new FileInputStream(stockproSigningFile))

          """
                  s = props + s
                  s = s.replace("android {", """android {
              signingConfigs {
                  stockproReleaseSigning {
                      storeFile file(stockproSigningProperties['storeFile'])
                      storePassword stockproSigningProperties['storePassword']
                      keyAlias stockproSigningProperties['keyAlias']
                      keyPassword stockproSigningProperties['keyPassword']
                  }
              }
          """, 1)
                  s = s.replace("release {", "release {\n            signingConfig signingConfigs.stockproReleaseSigning", 1)
                  gradle.write_text(s)
          elif gradle_kotlin.exists():
              gradle = gradle_kotlin
              s = gradle.read_text()
              if "stockproReleaseSigning" not in s:
                          imports = "import java.util.Properties" + chr(10) + "import java.io.FileInputStream" + chr(10)
                  props = """
          val stockproSigningProperties = Properties()
          val stockproSigningFile = rootProject.file("key.properties")
          stockproSigningProperties.load(FileInputStream(stockproSigningFile))
          """
                  body = chr(10).join(line for line in s.splitlines() if not line.startswith("import "))
                  s = imports + props + body + chr(10)
                  signing = """
              signingConfigs {
                  create("stockproReleaseSigning") {
                      storeFile = file(stockproSigningProperties["storeFile"] as String)
                      storePassword = stockproSigningProperties["storePassword"] as String
                      keyAlias = stockproSigningProperties["keyAlias"] as String
                      keyPassword = stockproSigningProperties["keyPassword"] as String
                  }
              }
          """
                  s = s.replace("android {", "android {" + chr(10) + signing, 1)
                  s = s.replace("release {", "release {" + chr(10) + "            signingConfig = signingConfigs.getByName(\\"stockproReleaseSigning\\")", 1)
                  gradle.write_text(s)
          else:
              raise SystemExit("Generated Gradle build file not found")
          PY
      - name: Replace starter test with smoke test
        run: |
          mkdir -p test
          cat > test/widget_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:stockpro/main.dart';

          void main() {
            testWidgets('StockPro splash navigates to login', (tester) async {
              SharedPreferences.setMockInitialValues({});
              await tester.pumpWidget(const App());
              expect(find.text('StockPro Business'), findsOneWidget);
              await tester.pump(const Duration(milliseconds: 2300));
              await tester.pumpAndSettle();
              expect(find.text('دخول'), findsOneWidget);
            });
          }
          EOF
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run smoke test
        run: flutter test
      - name: Build signed release APK
        run: flutter build apk --release --build-number ${{ github.run_number }}
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockpro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
