name: Build StockPro Release Candidate
on:
  workflow_dispatch:
  push:
    branches: [ main, 'commercial/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
      - name: Generate Android project files
        run: flutter create --platforms=android --org com.stockpro --project-name stockpro .
      - name: Set Android launcher label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s, n = re.subn(r'android:label="[^"]+"', 'android:label="StockPro Business"', s, count=1)
          if n != 1:
              raise SystemExit("Could not set Android app label")
          p.write_text(s)
          PY
      - name: Replace generated starter test with StockPro smoke test
        run: |
          mkdir -p test
          cat > test/widget_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:stockpro/main.dart';

          void main() {
            testWidgets('StockPro splash navigates to login', (tester) async {
              SharedPreferences.setMockInitialValues({});
              await tester.pumpWidget(const App());
              expect(find.text('StockPro Business'), findsOneWidget);
              await tester.pump(const Duration(milliseconds: 2300));
              await tester.pumpAndSettle();
              expect(find.text('دخول'), findsOneWidget);
            });
          }
          EOF
      - name: Configure stable release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.STOCKPRO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STOCKPRO_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing STOCKPRO_KEYSTORE_BASE64 or STOCKPRO_KEYSTORE_PASSWORD repository secret."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/stockpro-upload-key.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=stockpro
          storeFile=stockpro-upload-key.jks
          EOF
      - name: Apply release signing configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          marker = "android {"
          if marker not in s:
              raise SystemExit("Could not find android block in generated build.gradle")
          if "signingConfigs {" in s:
              raise SystemExit("Generated Gradle already has signingConfigs; refusing duplicate injection")
          props = """def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

          """
          signing = """android {
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }
          """
          s = s.replace(marker, props + signing, 1)
          s = re.sub(r"signingConfig\\s*(?:=\\s*)?signingConfigs\\.debug", "signingConfig signingConfigs.release", s)
          if "signingConfig = signingConfigs.release" not in s:
              raise SystemExit("Could not apply release signing configuration")
          p.write_text(s)
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run smoke tests
        run: flutter test
      - name: Build signed APK
        run: flutter build apk --release
      - name: Build signed Play Store App Bundle
        run: flutter build appbundle --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stockpro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: stockpro-play-store-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
