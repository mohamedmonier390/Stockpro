name: Build StockPro Release Candidate
on:
  workflow_dispatch:
  push:
    branches: [ main, 'commercial/**', 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
      - name: Require stable release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
      - name: Generate Android project files
        run: flutter create --platforms=android --org com.stockpro --project-name stockpro .
      - name: Set app label and configure permanent signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/stockpro-release-key.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=stockpro-release-key.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()
          s, n = re.subn(r'android:label="[^"]+"', 'android:label="StockPro Business"', s, count=1)
          if n != 1: raise SystemExit("Could not set app label")
          manifest.write_text(s)
          gradle = Path("android/app/build.gradle")
          if not gradle.exists(): raise SystemExit("Generated Groovy Gradle file missing")
          s = gradle.read_text()
          if "stockproReleaseSigning" not in s:
              block = """
          def stockproSigningProperties = new Properties()
          def stockproSigningFile = rootProject.file('key.properties')
          if (stockproSigningFile.exists()) {
              stockproSigningProperties.load(new FileInputStream(stockproSigningFile))
          }

          """
              s = block + s
              anchor = "android {"
              signing = """android {
              signingConfigs {
                  stockproReleaseSigning {
                      storeFile file('stockpro-release-key.jks')
                      storePassword stockproSigningProperties['storePassword']
                      keyAlias stockproSigningProperties['keyAlias']
                      keyPassword stockproSigningProperties['keyPassword']
                  }
              }
          """
              if anchor not in s: raise SystemExit("Missing android block")
              s = s.replace(anchor, signing, 1)
              s = s.replace("release {\n", "release {\n            signingConfig signingConfigs.stockproReleaseSigning\n", 1)
              gradle.write_text(s)
          PY
      - name: Replace generated starter test with StockPro smoke test
        run: |
          mkdir -p test
          cat > test/widget_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:stockpro/main.dart';

          void main() {
            testWidgets('StockPro splash navigates to login', (tester) async {
              SharedPreferences.setMockInitialValues({});
              await tester.pumpWidget(const App());
              expect(find.text('StockPro Business'), findsOneWidget);
              await tester.pump(const Duration(milliseconds: 2300));
              await tester.pumpAndSettle();
              expect(find.text('دخول'), findsOneWidget);
            });
          }
          EOF
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run smoke tests
        run: flutter test
      - name: Build signed APK with incrementing version code
        run: flutter build apk --release --build-number ${{ github.run_number }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stockpro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
