name: Build StockPro Release Candidate
on:
  workflow_dispatch:
  push:
    branches: [ main, 'commercial/**', 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
      - name: Verify build toolchain
        run: flutter --version && java -version
      - name: Validate permanent signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then echo "Missing secret: $secret"; exit 1; fi
          done
      - name: Generate Android project files
        run: flutter create --platforms=android --org com.stockpro --project-name stockpro .
      - name: Configure label and release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/stockpro-release-key.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=stockpro-release-key.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()
          s, n = re.subn(r'android:label="[^"]+"', 'android:label="StockPro Business"', s, count=1)
          if n != 1: raise SystemExit("Could not set app label")
          manifest.write_text(s)
          Path("android/app/build.gradle.kts").unlink(missing_ok=True)
          PY
          cat > android/app/build.gradle <<'GRADLE'
          import java.util.Properties
          import java.io.FileInputStream

          plugins {
              id 'com.android.application'
              id 'kotlin-android'
              id 'dev.flutter.flutter-gradle-plugin'
          }

          def signingProps = new Properties()
          def signingFile = rootProject.file('key.properties')
          signingProps.load(new FileInputStream(signingFile))

          android {
              namespace 'com.stockpro.stockpro'
              compileSdk flutter.compileSdkVersion
              ndkVersion flutter.ndkVersion
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }
              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_11.toString()
              }
              defaultConfig {
                  applicationId 'com.stockpro.stockpro'
                  minSdk flutter.minSdkVersion
                  targetSdk flutter.targetSdkVersion
                  versionCode flutter.versionCode
                  versionName flutter.versionName
              }
              signingConfigs {
                  stockproReleaseSigning {
                      storeFile file(signingProps['storeFile'])
                      storePassword signingProps['storePassword']
                      keyAlias signingProps['keyAlias']
                      keyPassword signingProps['keyPassword']
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.stockproReleaseSigning
                  }
              }
          }
          flutter {
              source '../..'
          }
          GRADLE
      - name: Replace starter test with smoke test
        run: |
          mkdir -p test
          cat > test/widget_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:stockpro/main.dart';

          void main() {
            testWidgets('StockPro splash navigates to login', (tester) async {
              SharedPreferences.setMockInitialValues({});
              await tester.pumpWidget(const App());
              expect(find.text('StockPro Business'), findsOneWidget);
              await tester.pump(const Duration(milliseconds: 2300));
              await tester.pumpAndSettle();
              expect(find.text('Login'), findsNWidgets(2));
            });
          }
          EOF
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run smoke test
        run: flutter test
      - name: Build signed release APK
        run: flutter build apk --release --build-number ${{ github.run_number }}
      - name: Verify APK package and permanent signing certificate
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          if [ -z "$AAPT" ]; then echo "aapt not found"; exit 1; fi
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.stockpro.stockpro'" >/dev/null || { echo "Unexpected package/applicationId"; exit 1; }
          ACTUAL=$(keytool -printcert -jarfile "$APK" | awk '/SHA256:/{print $2}' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          EXPECTED=167A3BDFB5DD39E33B80F0CBDF222DE4A69EFB5FC083911B8BBF3BDF6B9EBF45
          if [ "$ACTUAL" != "$EXPECTED" ]; then echo "Signing certificate changed!"; exit 1; fi
          echo "APK package and signing certificate verified."
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockpro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
